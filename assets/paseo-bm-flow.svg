<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="484" viewBox="0 0 1000 484" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How paseo-bm carries a request</title>
  <desc id="desc">You describe a change to the Beads Manager, which hands it to a Beads Worker. The Worker sizes the request, writes documents only when needed, creates beads, implements them one at a time with evidence, and has a Reviewer check each stage. Reports flow back to the Manager and to you.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="chevron" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#f97316"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="483" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- The agents -->
  <g text-anchor="middle">
    <rect x="30" y="40" width="140" height="94" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="100" y="74" font-size="16" font-weight="700" fill="#111827">You</text>
    <text x="100" y="97" font-size="12" fill="#4b5563">describe the change</text>
    <text x="100" y="113" font-size="12" fill="#4b5563">in chat</text>

    <rect x="260" y="40" width="190" height="94" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="355" y="74" font-size="16" font-weight="700" fill="#1e3a8a">Beads Manager</text>
    <text x="355" y="97" font-size="12" fill="#4b5563">hands it on at once,</text>
    <text x="355" y="113" font-size="12" fill="#4b5563">relays every report</text>

    <rect x="540" y="40" width="190" height="94" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="635" y="74" font-size="16" font-weight="700" fill="#7c2d12">Beads Worker</text>
    <text x="635" y="97" font-size="12" fill="#4b5563">carries one request</text>
    <text x="635" y="113" font-size="12" fill="#4b5563">from start to finish</text>

    <rect x="820" y="40" width="150" height="94" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="895" y="74" font-size="16" font-weight="700" fill="#4c1d95">Reviewer</text>
    <text x="895" y="97" font-size="12" fill="#4b5563">checks each stage,</text>
    <text x="895" y="113" font-size="12" fill="#4b5563">edits nothing</text>
  </g>

  <!-- Messages between them -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <line x1="176" y1="72" x2="254" y2="72" marker-end="url(#arrow)"/>
    <line x1="456" y1="72" x2="534" y2="72" marker-end="url(#arrow)"/>
    <line x1="736" y1="72" x2="814" y2="72" marker-end="url(#arrow)"/>
    <line x1="254" y1="104" x2="176" y2="104" marker-end="url(#arrow)"/>
    <line x1="534" y1="104" x2="456" y2="104" marker-end="url(#arrow)"/>
    <line x1="814" y1="104" x2="736" y2="104" marker-end="url(#arrow)"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#374151">
    <text x="215" y="64">request</text>
    <text x="495" y="64">delegates</text>
    <text x="775" y="64">each stage</text>
    <text x="215" y="121">answers</text>
    <text x="495" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BM-REPORT</text>
    <text x="775" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BM-REVIEW</text>
  </g>

  <!-- The Worker's loop -->
  <line x1="635" y1="134" x2="635" y2="186" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="30" y="178" font-size="13" font-weight="700" fill="#374151">What the Worker does with one request</text>
  <rect x="30" y="190" width="940" height="110" rx="12" fill="#fff7ed" stroke="#fdba74"/>

  <g text-anchor="middle">
    <rect x="45" y="205" width="130" height="80" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="110" y="229" font-size="13" font-weight="700" fill="#7c2d12">1  Size</text>
    <text x="110" y="250" font-size="11.5" fill="#4b5563">Small, Medium</text>
    <text x="110" y="266" font-size="11.5" fill="#4b5563">or Large</text>

    <rect x="201" y="205" width="130" height="80" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="266" y="229" font-size="13" font-weight="700" fill="#7c2d12">2  Documents</text>
    <text x="266" y="250" font-size="11.5" fill="#4b5563">only when the</text>
    <text x="266" y="266" font-size="11.5" fill="#4b5563">size needs them</text>

    <rect x="357" y="205" width="130" height="80" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="422" y="229" font-size="13" font-weight="700" fill="#7c2d12">3  Beads</text>
    <text x="422" y="250" font-size="11.5" fill="#4b5563">one outcome each,</text>
    <text x="422" y="266" font-size="11.5" fill="#4b5563">with its proof</text>

    <rect x="513" y="205" width="130" height="80" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="578" y="229" font-size="13" font-weight="700" fill="#7c2d12">4  Implement</text>
    <text x="578" y="250" font-size="11.5" fill="#4b5563">one bead at a time,</text>
    <text x="578" y="266" font-size="11.5" fill="#4b5563">proved, then closed</text>

    <rect x="669" y="205" width="130" height="80" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="734" y="229" font-size="13" font-weight="700" fill="#7c2d12">5  Review</text>
    <text x="734" y="250" font-size="11.5" fill="#4b5563">a Reviewer checks</text>
    <text x="734" y="266" font-size="11.5" fill="#4b5563">each stage</text>

    <rect x="825" y="205" width="130" height="80" rx="10" fill="#ffffff" stroke="#fdba74"/>
    <text x="890" y="229" font-size="13" font-weight="700" fill="#7c2d12">6  Finished</text>
    <text x="890" y="250" font-size="11.5" fill="#4b5563">you read git diff</text>
    <text x="890" y="266" font-size="11.5" fill="#4b5563">and commit</text>
  </g>
  <g stroke="#f97316" stroke-width="1.5">
    <line x1="178" y1="245" x2="197" y2="245" marker-end="url(#chevron)"/>
    <line x1="334" y1="245" x2="353" y2="245" marker-end="url(#chevron)"/>
    <line x1="490" y1="245" x2="509" y2="245" marker-end="url(#chevron)"/>
    <line x1="646" y1="245" x2="665" y2="245" marker-end="url(#chevron)"/>
    <line x1="802" y1="245" x2="821" y2="245" marker-end="url(#chevron)"/>
  </g>

  <!-- Size decides the rigor -->
  <text x="30" y="334" font-size="13" font-weight="700" fill="#374151">The size decides how much process a request gets</text>
  <g>
    <rect x="30" y="346" width="300" height="108" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="50" y="373" font-size="14" font-weight="700" fill="#14532d">Small</text>
    <text x="50" y="396" font-size="12" fill="#4b5563">One component, no contract change.</text>
    <text x="50" y="414" font-size="12" fill="#4b5563">One bead, no documents,</text>
    <text x="50" y="432" font-size="12" fill="#4b5563">one review.</text>

    <rect x="350" y="346" width="300" height="108" rx="12" fill="#fefce8" stroke="#fde047"/>
    <text x="370" y="373" font-size="14" font-weight="700" fill="#713f12">Medium</text>
    <text x="370" y="396" font-size="12" fill="#4b5563">Anything in between.</text>
    <text x="370" y="414" font-size="12" fill="#4b5563">Affected doc sections and beads,</text>
    <text x="370" y="432" font-size="12" fill="#4b5563">two review stages.</text>

    <rect x="670" y="346" width="300" height="108" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="690" y="373" font-size="14" font-weight="700" fill="#7f1d1d">Large</text>
    <text x="690" y="396" font-size="12" fill="#4b5563">Contract, schema, auth or many parts.</text>
    <text x="690" y="414" font-size="12" fill="#4b5563">Full documents, three review stages,</text>
    <text x="690" y="432" font-size="12" fill="#4b5563">and it asks you before building.</text>
  </g>
</svg>
