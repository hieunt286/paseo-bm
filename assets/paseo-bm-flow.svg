<svg xmlns="http://www.w3.org/2000/svg" width="1000" height="490" viewBox="0 0 1000 490" role="img" aria-labelledby="title desc" font-family="-apple-system, BlinkMacSystemFont, 'Segoe UI', Helvetica, Arial, sans-serif">
  <title id="title">How paseo-bm carries a request</title>
  <desc id="desc">You talk to the Beads Manager. It answers what it can read itself and hands every change to a Beads Worker. The Worker sizes the change and uses only the process that size needs: a Small change is made and proved by a check, with no bead and no review; a Medium change gets beads written by hand and one review of the implementation; a Large change gets documents where a decision or contract changes, a review before building, beads, and a review of the implementation. Nothing leaves the workspace without your yes.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#6b7280"/>
    </marker>
    <marker id="chevron" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="6" markerHeight="6" orient="auto">
      <path d="M0,0 L10,5 L0,10 z" fill="#9ca3af"/>
    </marker>
  </defs>

  <rect x="0.5" y="0.5" width="999" height="489" rx="16" fill="#ffffff" stroke="#e5e7eb"/>

  <!-- The agents -->
  <g text-anchor="middle">
    <rect x="30" y="40" width="140" height="94" rx="12" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
    <text x="100" y="74" font-size="16" font-weight="700" fill="#111827">You</text>
    <text x="100" y="97" font-size="12" fill="#4b5563">describe a change</text>
    <text x="100" y="113" font-size="12" fill="#4b5563">or ask a question</text>
    <rect x="260" y="40" width="190" height="94" rx="12" fill="#eff6ff" stroke="#3b82f6" stroke-width="1.5"/>
    <text x="355" y="74" font-size="16" font-weight="700" fill="#1e3a8a">Beads Manager</text>
    <text x="355" y="97" font-size="12" fill="#4b5563">answers what it can read,</text>
    <text x="355" y="113" font-size="12" fill="#4b5563">hands every change on</text>
    <rect x="540" y="40" width="190" height="94" rx="12" fill="#fff7ed" stroke="#f97316" stroke-width="1.5"/>
    <text x="635" y="74" font-size="16" font-weight="700" fill="#7c2d12">Beads Worker</text>
    <text x="635" y="97" font-size="12" fill="#4b5563">sizes the change, uses only</text>
    <text x="635" y="113" font-size="12" fill="#4b5563">the process it needs</text>
    <rect x="820" y="40" width="150" height="94" rx="12" fill="#f5f3ff" stroke="#8b5cf6" stroke-width="1.5"/>
    <text x="895" y="74" font-size="16" font-weight="700" fill="#4c1d95">Reviewer</text>
    <text x="895" y="97" font-size="12" fill="#4b5563">Medium and Large,</text>
    <text x="895" y="113" font-size="12" fill="#4b5563">or when you ask</text>
  </g>

  <!-- Messages between them -->
  <g stroke="#6b7280" stroke-width="1.5" fill="none">
    <line x1="176" y1="72" x2="254" y2="72" marker-end="url(#arrow)"/>
    <line x1="456" y1="72" x2="534" y2="72" marker-end="url(#arrow)"/>
    <line x1="736" y1="72" x2="814" y2="72" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
    <line x1="254" y1="104" x2="176" y2="104" marker-end="url(#arrow)"/>
    <line x1="534" y1="104" x2="456" y2="104" marker-end="url(#arrow)"/>
    <line x1="814" y1="104" x2="736" y2="104" marker-end="url(#arrow)" stroke-dasharray="5 4"/>
  </g>
  <g text-anchor="middle" font-size="11" fill="#374151">
    <text x="215" y="64">request</text>
    <text x="495" y="64">each change</text>
    <text x="775" y="64">what to review</text>
    <text x="215" y="121">answers</text>
    <text x="495" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BM-REPORT</text>
    <text x="775" y="121" font-family="ui-monospace, SFMono-Regular, Menlo, monospace">BM-REVIEW</text>
  </g>

  <!-- The size decides the path -->
  <line x1="635" y1="134" x2="635" y2="170" stroke="#f97316" stroke-width="1.5" stroke-dasharray="5 4"/>
  <text x="30" y="164" font-size="13" font-weight="700" fill="#374151">The Worker sizes the change, and the size decides how much process it gets</text>

  <g>
    <rect x="30" y="178" width="940" height="76" rx="12" fill="#f0fdf4" stroke="#86efac"/>
    <text x="46" y="208" font-size="14" font-weight="700" fill="#14532d">Small</text>
    <text x="46" y="226" font-size="11.5" fill="#4b5563">one clear, local change</text>
    <text x="46" y="241" font-size="11.5" fill="#4b5563">easy to undo</text>
    <text x="390" y="220" font-size="11.5" font-style="italic" fill="#6b7280" text-anchor="middle">no bead, no new document, no review unless you ask</text>
    <rect x="588" y="188" width="116" height="56" rx="9" fill="#ffffff" stroke="#86efac"/>
    <text x="646" y="207" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">Make the change</text>
    <text x="646" y="223" font-size="10.5" fill="#4b5563" text-anchor="middle">local, easy to undo</text>
    <rect x="716" y="188" width="116" height="56" rx="9" fill="#ffffff" stroke="#86efac"/>
    <text x="774" y="207" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">Prove it</text>
    <text x="774" y="223" font-size="10.5" fill="#4b5563" text-anchor="middle">a check, and its</text>
    <text x="774" y="236" font-size="10.5" fill="#4b5563" text-anchor="middle">output as evidence</text>
    <rect x="844" y="188" width="116" height="56" rx="9" fill="#ffffff" stroke="#86efac"/>
    <text x="902" y="207" font-size="12.5" font-weight="700" fill="#14532d" text-anchor="middle">Finished</text>
    <text x="902" y="223" font-size="10.5" fill="#4b5563" text-anchor="middle">you read git diff</text>
    <text x="902" y="236" font-size="10.5" fill="#4b5563" text-anchor="middle">and commit</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="705" y1="216" x2="713" y2="216" marker-end="url(#chevron)"/>
    <line x1="833" y1="216" x2="841" y2="216" marker-end="url(#chevron)"/>
  </g>
  <g>
    <rect x="30" y="262" width="940" height="76" rx="12" fill="#fefce8" stroke="#fde047"/>
    <text x="46" y="292" font-size="14" font-weight="700" fill="#713f12">Medium</text>
    <text x="46" y="310" font-size="11.5" fill="#4b5563">several outcomes, or</text>
    <text x="46" y="325" font-size="11.5" fill="#4b5563">work to hand over</text>
    <text x="326" y="304" font-size="11.5" font-style="italic" fill="#6b7280" text-anchor="middle">no new document unless a decision changes</text>
    <rect x="460" y="272" width="116" height="56" rx="9" fill="#ffffff" stroke="#fde047"/>
    <text x="518" y="291" font-size="12.5" font-weight="700" fill="#713f12" text-anchor="middle">Beads</text>
    <text x="518" y="307" font-size="10.5" fill="#4b5563" text-anchor="middle">written by hand,</text>
    <text x="518" y="320" font-size="10.5" fill="#4b5563" text-anchor="middle">one outcome each</text>
    <rect x="588" y="272" width="116" height="56" rx="9" fill="#ffffff" stroke="#fde047"/>
    <text x="646" y="291" font-size="12.5" font-weight="700" fill="#713f12" text-anchor="middle">Implement</text>
    <text x="646" y="307" font-size="10.5" fill="#4b5563" text-anchor="middle">one bead at a time,</text>
    <text x="646" y="320" font-size="10.5" fill="#4b5563" text-anchor="middle">proved, then closed</text>
    <rect x="716" y="272" width="116" height="56" rx="9" fill="#ffffff" stroke="#fde047"/>
    <text x="774" y="291" font-size="12.5" font-weight="700" fill="#713f12" text-anchor="middle">Review</text>
    <text x="774" y="307" font-size="10.5" fill="#4b5563" text-anchor="middle">the implementation:</text>
    <text x="774" y="320" font-size="10.5" fill="#4b5563" text-anchor="middle">once, re-check once</text>
    <rect x="844" y="272" width="116" height="56" rx="9" fill="#ffffff" stroke="#fde047"/>
    <text x="902" y="291" font-size="12.5" font-weight="700" fill="#713f12" text-anchor="middle">Finished</text>
    <text x="902" y="307" font-size="10.5" fill="#4b5563" text-anchor="middle">you read git diff</text>
    <text x="902" y="320" font-size="10.5" fill="#4b5563" text-anchor="middle">and commit</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="577" y1="300" x2="585" y2="300" marker-end="url(#chevron)"/>
    <line x1="705" y1="300" x2="713" y2="300" marker-end="url(#chevron)"/>
    <line x1="833" y1="300" x2="841" y2="300" marker-end="url(#chevron)"/>
  </g>
  <g>
    <rect x="30" y="346" width="940" height="76" rx="12" fill="#fef2f2" stroke="#fca5a5"/>
    <text x="46" y="376" font-size="14" font-weight="700" fill="#7f1d1d">Large</text>
    <text x="46" y="394" font-size="11.5" fill="#4b5563">hard to undo, or changes</text>
    <text x="46" y="409" font-size="11.5" fill="#4b5563">what others rely on</text>
    <rect x="204" y="356" width="116" height="56" rx="9" fill="#ffffff" stroke="#fca5a5"/>
    <text x="262" y="375" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Documents</text>
    <text x="262" y="391" font-size="10.5" fill="#4b5563" text-anchor="middle">where a decision or</text>
    <text x="262" y="404" font-size="10.5" fill="#4b5563" text-anchor="middle">contract changes</text>
    <rect x="332" y="356" width="116" height="56" rx="9" fill="#ffffff" stroke="#fca5a5"/>
    <text x="390" y="375" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Review</text>
    <text x="390" y="391" font-size="10.5" fill="#4b5563" text-anchor="middle">documents and</text>
    <text x="390" y="404" font-size="10.5" fill="#4b5563" text-anchor="middle">beads, first</text>
    <rect x="460" y="356" width="116" height="56" rx="9" fill="#ffffff" stroke="#fca5a5"/>
    <text x="518" y="375" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Beads</text>
    <text x="518" y="391" font-size="10.5" fill="#4b5563" text-anchor="middle">from a plan,</text>
    <text x="518" y="404" font-size="10.5" fill="#4b5563" text-anchor="middle">or by hand</text>
    <rect x="588" y="356" width="116" height="56" rx="9" fill="#ffffff" stroke="#fca5a5"/>
    <text x="646" y="375" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Implement</text>
    <text x="646" y="391" font-size="10.5" fill="#4b5563" text-anchor="middle">one bead at a time,</text>
    <text x="646" y="404" font-size="10.5" fill="#4b5563" text-anchor="middle">proved, then closed</text>
    <rect x="716" y="356" width="116" height="56" rx="9" fill="#ffffff" stroke="#fca5a5"/>
    <text x="774" y="375" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Review</text>
    <text x="774" y="391" font-size="10.5" fill="#4b5563" text-anchor="middle">the implementation:</text>
    <text x="774" y="404" font-size="10.5" fill="#4b5563" text-anchor="middle">once, re-check once</text>
    <rect x="844" y="356" width="116" height="56" rx="9" fill="#ffffff" stroke="#fca5a5"/>
    <text x="902" y="375" font-size="12.5" font-weight="700" fill="#7f1d1d" text-anchor="middle">Finished</text>
    <text x="902" y="391" font-size="10.5" fill="#4b5563" text-anchor="middle">you read git diff</text>
    <text x="902" y="404" font-size="10.5" fill="#4b5563" text-anchor="middle">and commit</text>
  </g>
  <g stroke="#9ca3af" stroke-width="1.5">
    <line x1="321" y1="384" x2="329" y2="384" marker-end="url(#chevron)"/>
    <line x1="449" y1="384" x2="457" y2="384" marker-end="url(#chevron)"/>
    <line x1="577" y1="384" x2="585" y2="384" marker-end="url(#chevron)"/>
    <line x1="705" y1="384" x2="713" y2="384" marker-end="url(#chevron)"/>
    <line x1="833" y1="384" x2="841" y2="384" marker-end="url(#chevron)"/>
  </g>
  <text x="30" y="444" font-size="12" fill="#374151">A request that needs no design of the Worker's, such as an answer or exactly what you spelled out, is done and shown with its evidence: no bead, no review.</text>
  <text x="30" y="464" font-size="12" fill="#374151">Nothing leaves the workspace without your yes: no commit, push or publish on its own. Only you archive or delete an agent.</text>
</svg>
