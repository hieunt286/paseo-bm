name: CI

# Kept minimal on purpose (Design §10, errata 2026-09-18): one job on the lowest
# supported Node. The full matrix (macOS and Linux, Node 22 and 24), the build,
# the packed-package smoke test and the lifecycle-script guard run in
# release.yml, before anything is published.

on:
  push:
    branches: [main]
    # A commit that only touches documentation or beads changes nothing these
    # checks read: no test reads these files. plugin/roles/*.md is deliberately
    # not listed, because it is embedded into the plugin bundle and tested.
    paths-ignore:
      - "docs/**"
      - ".beads/**"
      - "README.md"
      - "GUIDE.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "assets/**"
  pull_request:
    paths-ignore:
      - "docs/**"
      - ".beads/**"
      - "README.md"
      - "GUIDE.md"
      - "AGENTS.md"
      - "CLAUDE.md"
      - "assets/**"

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    name: verify (ubuntu, node 22)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      # npm ci refuses to run without a lockfile, which is what we want:
      # dependency drift must fail loudly instead of being resolved silently.
      - name: Install dependencies
        run: npm ci

      - name: Typecheck
        run: npm run typecheck

      - name: Typecheck plugin
        run: npm run typecheck:plugin

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm test
